<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <style>
        /* Centraliza a tela inteira na página */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Container principal com a borda externa mais clara */
        .outer-box {
            background-color: #616c84;
            padding: 15px;
            border-radius: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Container interno (fundo escuro do formulário) */
        .register-card {
            background-color: #3b4257;
            width: 380px;
            padding: 35px 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Cabeçalho superior alinhado à esquerda */
        .header-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
            padding-left: 5px;
        }

        /* Ícone de usuário menor posicionado à esquerda */
        .user-icon {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
        }

        /* Título com fundo preto e bordas arredondadas */
        .title-badge {
            background-color: #000000;
            color: #ffffff;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: normal;
            white-space: nowrap;
        }

        /* Campos de entrada arredondados */
        .input-field {
            width: 100%;
            height: 45px;
            background-color: #ffffff;
            border: none;
            border-radius: 25px;
            margin-bottom: 15px;
            padding: 0 20px;
            font-size: 16px;
            color: #000000;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        /* Estilização do texto do placeholder */
        .input-field::placeholder {
            color: #000000;
            opacity: 1;
        }

        /* Botão Register */
        .btn-register {
            width: 100%;
            height: 45px;
            background-color: #707070;
            border: none;
            border-radius: 25px;
            color: #000000;
            font-size: 16px;
            font-weight: normal;
            cursor: pointer;
            margin-top: 5px;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-register:hover {
            background-color: #606060;
        }
    </style>
</head>
<body>

    <!-- Caixa externa (borda grossa) -->
    <div class="outer-box">
        <!-- Caixa interna do cadastro -->
        <div class="register-card">
            
            <!-- Seção do topo: Ícone + Título Preto -->
            <div class="header-container">
                <svg class="user-icon" viewBox="0 0 100 100">
                    <circle cx="50" cy="35" r="16" stroke="#1d212b" stroke-width="2.5" fill="none" />
                    <path d="M20,78 C20,58 32,55 50,55 C68,55 80,58 80,78" stroke="#1d212b" stroke-width="2.5" fill="none" />
                </svg>
                <div class="title-badge">Cadastro do Usuario</div>
            </div>

            <!-- Campos do Formulário -->
            <input type="email" class="input-field" placeholder="Email">
            <input type="text" class="input-field" placeholder="Username">
            <input type="password" class="input-field" placeholder="Password">
            
            <!-- Botão de Registro -->
            <button class="btn-register">Register</button>

        </div>
    </div>

</body>
</html>
