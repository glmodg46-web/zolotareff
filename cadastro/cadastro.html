<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <style>
        /* Centraliza a tela inteira na página */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Container principal com a borda externa mais clara */
        .outer-box {
            background-color: #616c84;
            padding: 15px;
            border-radius: 28px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Container interno (fundo escuro do formulário) */
        .login-card {
            background-color: #3b4257;
            width: 380px;
            padding: 40px 30px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* Ícone de usuário desenhado em SVG para precisão */
        .user-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 35px;
        }

        .user-icon path {
            fill: none;
            stroke: #1d212b;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* Campos de entrada (Username e Password) */
        .input-field {
            width: 100%;
            height: 45px;
            background-color: #ffffff;
            border: none;
            border-radius: 25px;
            margin-bottom: 18px;
            padding: 0 20px;
            font-size: 16px;
            color: #000000;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        /* Estilização do texto de marca d'água (Placeholder) */
        .input-field::placeholder {
            color: #000000;
            opacity: 1;
        }

        /* Botão ENTER */
        .btn-enter {
            width: 100%;
            height: 45px;
            background-color: #707070;
            border: none;
            border-radius: 25px;
            color: #000000;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .btn-enter:hover {
            background-color: #606060;
        }
    </style>
</head>
<body>

    <!-- Caixa externa (borda grossa) -->
    <div class="outer-box">
        <!-- Caixa interna do login -->
        <div class="login-card">
            
            <!-- Ícone de Usuário em SVG idêntico ao contorno da imagem -->
            <svg class="user-icon" viewBox="0 0 100 100">
                <!-- Cabeça -->
                <circle cx="50" cy="35" r="14" stroke="#1d212b" stroke-width="2.5" fill="none" />
                <!-- Ombros -->
                <path d="M25,75 C25,58 35,55 50,55 C65,55 75,58 75,75" stroke="#1d212b" stroke-width="2.5" fill="none" />
            </svg>

            <!-- Formulário -->
            <input type="text" class="input-field" placeholder="Username">
            <input type="password" class="input-field" placeholder="Password">
            <button class="btn-enter">ENTER</button>

        </div>
    </div>

</body>
</html>
